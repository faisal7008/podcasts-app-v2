name: Trigger auto deployment for podcasts-ai-web

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ deploy ]
    paths:
    - '**'
    - '.github/workflows/podcasts-ai-web-AutoDeployTrigger-a4f82264-c5f0-4fdc-b3b2-172de5980fbf.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.PODCASTSAIWEB_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.PODCASTSAIWEB_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PODCASTSAIWEB_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/frontend
          dockerfilePath: Dockerfile
          registryUrl: podcastsai.azurecr.io
          registryUsername: ${{ secrets.PODCASTSAIWEB_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.PODCASTSAIWEB_REGISTRY_PASSWORD }}
          containerAppName: podcasts-ai-web
          resourceGroup: podcasts-ai_group
          imageToBuild: podcastsai.azurecr.io/podcasts-ai-web:${{ github.sha }}


