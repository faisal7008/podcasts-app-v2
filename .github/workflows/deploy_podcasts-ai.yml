# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and Deploy Next.js App to Azure Web App

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

env:
  NODE_VERSION: "24.x"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: frontend

    env:
      # Taddy
      TADDY_USER_ID: ${{ secrets.TADDY_USER_ID }}
      TADDY_API_KEY: ${{ secrets.TADDY_API_KEY }}

      # Database
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Better Auth
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}

      # App
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client and Build Next.js
        run: npm run build

      - name: Run tests
        run: npm test --if-present

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: frontend

  deploy:
    runs-on: ubuntu-latest

    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: frontend

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E1EBA9F291B84568B25AAD412CCB13E8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3BA3C38EF27648958E9529612163C3E3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_742FA3D1AE414DFBB9CC3F74D0E41FCA }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: podcasts-ai
          slot-name: Production
          package: frontend
