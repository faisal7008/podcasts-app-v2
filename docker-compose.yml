version: "3.8"

services:

  redis:
    image: redis:8
    ports:
      - "6379:6379"

  web:
    image: ${ACR_NAME:-podcastsai}.azurecr.io/web:latest
    build:
      context: .
      dockerfile: ./web/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./web/.env
    depends_on:
      # - db
      - redis

  media-worker:
    image: ${ACR_NAME:-podcastsai}.azurecr.io/media-worker:latest
    build:
      context: .
      dockerfile: ./media-worker/Dockerfile
    env_file:
      - ./media-worker/.env
    depends_on:
      - redis

  ai-worker:
    image: ${ACR_NAME:-podcastsai}.azurecr.io/ai-worker:latest
    build:
      context: .
      dockerfile: ./ai-worker/Dockerfile
    env_file:
      - ./ai-worker/.env
    depends_on:
      - redis
